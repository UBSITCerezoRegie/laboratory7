<div class="card">
    <h3>{{ leader.name }}</h3>
  
    <p>Age: {{ leader.age }}</p>
    <p>Location: {{ leader.location }}</p>
    <p>Badge: {{ leader.badge }}</p>
  
    <strong>Pokemon Team:</strong>
    <ul>
      @for (pokemon of leader.team; track pokemon) {
        <li>{{ pokemon }}</li>
      }
    </ul>
  
    <button (click)="toggleMotto()">
      Motto: 
    </button>
  
    @if(showMotto()) {
      <p>{{ leader.motto }}</p>
    }
  </div>
