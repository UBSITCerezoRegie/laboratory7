<img
  class="region-banner"
  src="pokemart.jpg"
  alt="Pokemart">


<div class="menu-section">

    <h1>Pokémart</h1>
  
    <div class="shop-grid">
  
      @for (item of pokemartService.items(); track item.id) {
  
        <div class="item-card">
          <h3>{{ item.name }}</h3>
          <p>₱{{ item.price }}</p>
  
          <button
            (click)="pokemartService.addToCart(item)">
            Add to Cart
          </button>
        </div>
  
      }
  
    </div>
  
    <div class="cart-section">
  
      <h2>Shopping Cart</h2>
  
      @for (item of pokemartService.cart(); track $index) {
  
        <div class="cart-item">
          <span>{{ item.name }}</span>
          <span>₱{{ item.price }}</span>
        </div>
  
      } @empty {
  
        <p>Cart is empty.</p>
  
      }
  
      <div class="total">
        Total: ₱{{ pokemartService.totalPrice() }}
      </div>
  
      <button
        class="checkout-btn"
        (click)="pokemartService.clearCart()">
        Checkout / Clear Cart
      </button>
  
    </div>
  
  </div>
