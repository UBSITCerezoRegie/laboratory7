<img
  class="region-banner"
  src="kanto.jpg"
  alt="Kanto Region">
<div class="menu-section">
  <h1>Favourite Pokemon from kanto region</h1>
  <div class="card-grid">
    @for (pokemon of PokemonService.kantoPokemon(); track pokemon.id) {

      <div class = "pokemon-card">
        <h3>{{ pokemon.name }}</h3>
        <p>Type: {{ pokemon.type }}</p>
        <p>Held Item: {{ pokemon.heldItem }}</p>
        <p>{{ pokemon.description }}</p>
      </div>
    
    }
  </div>
</div>
