<img
  class="region-banner"
  src="johto.jpg"
  alt="johto Region">
<div class="menu-section">
  <h1>Favourite Pokemon from johto region</h1>
  <div class="card-grid">
    @for (pokemon of PokemonService.johtoPokemon(); track pokemon.id) {

      <div class = "pokemon-card">
        <h3>{{ pokemon.name }}</h3>
        <p>Type: {{ pokemon.type }}</p>
        <p>Held Item: {{ pokemon.heldItem }}</p>
        <p>{{ pokemon.description }}</p>
      </div>
    
    }
  </div>
</div>
